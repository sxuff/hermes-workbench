name: Release

# release-please keeps a release PR open that bumps every version field and
# writes CHANGELOG.md from the Conventional Commit titles on main. Merging that
# PR tags vX.Y.Z and publishes the GitHub release.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
